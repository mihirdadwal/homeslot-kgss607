version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: homeslot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homeslot_db
      MYSQL_USER: homeslot_user
      MYSQL_PASSWORD: homeslot_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: homeslot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
